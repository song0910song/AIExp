[project]
name = "lighting-design-agent"
version = "0.1.0"
description = "CAD, lighting knowledge and DIALux luminaire workbench"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5",
    "fastapi>=0.116",
    "langchain>=1.3",
    "langchain-chroma>=1.1",
    "langchain-huggingface>=1.2",
    "langchain-openai>=1.1",
    "pydantic>=2.13",
    "Pillow>=11.0",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.26",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "sentence-transformers>=5.6",
    "uvicorn>=0.35",
    "ezdxf>=1.4",
    "shapely>=2.1.2",
]

[project.scripts]
lighting-agent = "lighting_agent.main:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lighting_agent = ["system_prompt.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
