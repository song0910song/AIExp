[project]
name = "lighting-design-agent"
version = "0.1.0"
description = "Auditable indoor lighting-design agent with DIALux Luminaire Finder integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5",
    "fastapi>=0.116",
    "langchain>=1.3",
    "langchain-chroma>=1.1",
    "langchain-huggingface>=1.2",
    "langchain-openai>=1.1",
    "pydantic>=2.13",
    "PyMuPDF>=1.26",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "sentence-transformers>=5.6",
    "torch>=2.7",
    "uvicorn>=0.35",
    "crawl4ai>=0.9.2",
    "ezdxf>=1.4",
    "matplotlib>=3.11.1",
    "shapely>=2.1.2",
]

[project.scripts]
lighting-agent = "lighting_agent.main:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
